<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>동림 관리자</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
</head>
<body>
  <!-- Decap CMS: 설정은 같은 폴더의 config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="../js/bottle.js"></script>
  <script>
    /* 제품 입력 화면 오른쪽 미리보기: 입력한 치수로 도면을 바로 그려 보여줍니다. */
    (async function () {
      let tax = { colors: [], closures: [], categories: [], moldTypes: [], decorations: [] };
      try { tax = await (await fetch('../content/taxonomy.json', { cache: 'no-cache' })).json(); } catch (e) { /* 기본값 사용 */ }
      const find = (list, k) => (list || []).find((x) => x.key === k) || {};
      const label = (list, k) => find(list, k).label || k;

      CMS.registerPreviewStyle('preview.css');

      const ProductPreview = createClass({
        render: function () {
          const d = this.props.entry.getIn(['data']).toJS();
          const colors = d.colors || [];
          const closures = d.closures || [];
          const warn = [];
          if (!d.height || !d.diameter) warn.push('높이와 지름을 입력하면 실제 비율로 도면이 그려집니다.');
          if (!d.neck) warn.push('넥 규격이 비어 있습니다.');
          if (!colors.length) warn.push('유리 색상을 하나 이상 골라주세요.');
          const svg = Bottle.render(d, { mode: 'drawing', w: 380, h: 440, color: find(tax.colors, colors[0]), closure: closures[0] || null });
          const img = d.image ? this.props.getAsset(d.image) : null;
          const rows = [
            ['품번', d.code], ['용도', label(tax.categories, d.category)], ['생산 방식', label(tax.moldTypes, d.moldType)],
            ['용량 / 만수', `${d.capacity || '-'} / ${d.fullCapacity || '-'} mL`],
            ['치수', `${Number(d.depth) > 0 ? `W ${d.diameter} × D ${d.depth}` : `Ø ${d.diameter || '-'}`} × H ${d.height || '-'} mm`],
            ['넥 규격', d.neck], ['중량', d.weight ? d.weight + ' g' : '-'],
            ['색상', colors.map((k) => label(tax.colors, k)).join(', ')],
            ['부자재', closures.map((k) => label(tax.closures, k)).join(', ')],
            ['후가공', (d.decorations || []).map((k) => label(tax.decorations, k)).join(', ')],
            ['MOQ', d.moq ? Number(d.moq).toLocaleString('ko-KR') + '개' : '-'], ['출고', d.leadTime],
          ];
          return h('div', { className: 'pv' },
            h('p', { className: 'pv__tag' }, d.published === false ? '비공개 · 사이트에 보이지 않음' : '사이트 미리보기'),
            h('h1', {}, d.name || '제품명'),
            warn.length ? h('ul', { className: 'pv__warn' }, warn.map((w, i) => h('li', { key: i }, w))) : null,
            h('div', { className: 'pv__grid' },
              h('div', { className: 'pv__draw', dangerouslySetInnerHTML: { __html: svg } }),
              img ? h('img', { className: 'pv__img', src: img.toString(), alt: '' }) : null),
            h('table', {}, h('tbody', {}, rows.map((r, i) => h('tr', { key: i }, h('th', {}, r[0]), h('td', {}, r[1] || '-'))))),
            d.summary ? h('p', { className: 'pv__sum' }, d.summary) : null,
            d.model3d ? h('p', { className: 'pv__3d' }, '3D 모델 연결됨: ' + d.model3d) : null
          );
        },
      });
      CMS.registerPreviewTemplate('products', ProductPreview);
    })();
  </script>
</body>
</html>
